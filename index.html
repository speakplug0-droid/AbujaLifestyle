<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AbujaLifestyle</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="game">
<div id="playerDebug" style="position:fixed;left:10px;top:58px;z-index:99999;background:rgba(0,0,0,.88);color:#fff;padding:8px 12px;border:2px solid #ffcc00;border-radius:8px;font:700 13px Arial;max-width:320px">PLAYER: STARTING…</div>
<canvas id="scene"></canvas>
<div class="hud brand">Abuja<span>Life</span><b>style 🇳🇬</b><i class="status">ONLINE ●</i></div>
<div class="hud topnav"><button>🗺 Map</button><button>🚘 Cars</button><button>🏠 Properties</button><button>💼 Jobs</button><button>🛒 Store</button><button>⚙ Settings</button></div>
<div class="money"><strong>₦1,250,000</strong><small>ID: <span id="playerId">Player001</span></small></div>
<div class="minimap"><div class="player-dot"></div></div>
<div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><button id="run">🏃</button><button id="car">🚘</button></div></div>
<button class="phone-open" id="phoneOpen">📱</button>
<div class="phone" id="phone"><div class="phone-shell"><div class="phone-head"><span>4:29 PM · 4G</span><button class="phone-close" id="phoneClose">✕ Close</button></div><div class="apps">
<button class="app">💼 Jobs</button><button class="app">💬 Messages</button><button class="app">🏦 Bank</button><button class="app">🚕 Ride</button><button class="app">🏠 Houses</button><button class="app">🚗 Cars</button><button class="app">🛍️ Shops</button><button class="app">📰 News</button><button class="app">🏛️ Abuja Gov</button><button class="app">👮 Police</button><button class="app">🕵️ EFCC</button><button class="app">🕵️ Federal</button><button class="app">🪖 Army</button><button class="app">🏴 Bandits</button><button class="app">🕴️ Club/Gang</button><button class="app">🌐 Internet</button><button class="app">📞 Contacts</button><button class="app">⚙️ Settings</button>
</div></div></div>
<div class="rotate">🔄 Rotate your phone<small>AbujaLifestyle is designed for landscape gameplay.</small></div>
</div>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const debug=document.getElementById("playerDebug");
const setDebug=(t,b=false)=>{debug.textContent="PLAYER: "+t;debug.style.borderColor=b?"#ff4444":"#55ff55";debug.style.color=b?"#ff7777":"#fff"};
addEventListener("error",e=>setDebug("JAVASCRIPT ERROR — "+(e.message||"unknown"),true));
addEventListener("unhandledrejection",e=>setDebug("ERROR — "+(e.reason?.message||e.reason||"unknown"),true));

const canvas=document.getElementById("scene");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fc9ef);scene.fog=new THREE.Fog(0x8fc9ef,70,260);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);
scene.add(new THREE.HemisphereLight(0xcfe9ff,0x4b3d2b,1.8));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-40,70,35);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x477b43));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function road(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),mat(0x24272b));m.position.set(x,.04,z);scene.add(m)}
road(0,0,16,420);road(0,0,420,16);
for(let z=-180;z<=180;z+=12){
 const lane=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,6),mat(0xe8e0b0)); lane.position.set(0,.10,z); scene.add(lane);
}

function building(x,z,w,h,d,c=0x9a9c94){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);for(let y=4;y<h-1;y+=4)for(let xx=-w/2+2;xx<w/2-1;xx+=4){const win=new THREE.Mesh(new THREE.BoxGeometry(1.4,.8,.05),new THREE.MeshStandardMaterial({color:0x274d65,roughness:.3,metalness:.2}));win.position.set(x+xx,y,z-d/2-.03);scene.add(win)}}
building(-24,-22,18,24,18,0xaaa89e);building(27,-35,22,38,20,0x777d83);building(-28,32,20,30,22,0x8c938e);building(28,45,26,48,24,0x9c9689);
for(let i=0;i<22;i++){const z=-100+i*10;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,3),mat(0x70462e));trunk.position.set(-12,1.5,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.2,16,12),mat(0x1f7d3d));crown.position.set(-12,4,z);crown.castShadow=true;scene.add(crown)}

const player=new THREE.Group();player.position.set(0,0,2);scene.add(player);
let playerModel=null,playerReady=false,walkTime=0,walkAmount=0;
function addPlayerFallback(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,1.0,6,12),mat(0x2d8b57)); body.position.y=1.0; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0xc98f6b)); head.position.y=1.9; g.add(head);
  const legMat=mat(0x20252b);
  for(const x of [-.18,.18]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.18,.7,.18),legMat);leg.position.set(x,.35,0);g.add(leg)}
  const armMat=mat(0x2d8b57);
  for(const x of [-.48,.48]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.16,.7,.16),armMat);arm.position.set(x,1.15,0);arm.rotation.z=x<0?.15:-.15;g.add(arm)}
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});player.add(g);playerModel=g;playerReady=true;setDebug("PLAYER READY ✓");
}

const loader=new GLTFLoader();setDebug("PLAYER READY ✓"); addPlayerFallback(); setDebug("PLAYER READY ✓");
loader.load("https://raw.githubusercontent.com/speakplug0-droid/abuja-lifestyle/main/Superhero_Male_FullBody.gltf",gltf=>{
  playerModel=gltf.scene;
  const originalBox=new THREE.Box3().setFromObject(playerModel),originalSize=originalBox.getSize(new THREE.Vector3());
  const targetHeight=1.9;
  if(originalSize.y>0) playerModel.scale.setScalar(targetHeight/originalSize.y);playerModel.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(playerModel),center=box.getCenter(new THREE.Vector3());
  playerModel.position.x-=center.x;playerModel.position.z-=center.z;playerModel.position.y-=box.min.y;
  playerModel.traverse(o=>{
    o.visible=true;
    if(!o.isMesh)return;
    o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.renderOrder=50;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    for(const m of ms){
      m.side=THREE.DoubleSide;m.transparent=false;m.opacity=1;m.depthWrite=true;m.depthTest=true;m.needsUpdate=true;
      if(m.color)m.color.set(0x55a86a);
      if(m.emissive){m.emissive.set(0x163b20);m.emissiveIntensity=.35}
    }
    if(o.isSkinnedMesh){o.normalizeSkinWeights();o.pose();o.computeBoundingSphere()}
  });
  const fallback=playerModel; player.add(playerModel);player.position.set(0,0,2);player.updateMatrixWorld(true);playerModel.updateMatrixWorld(true);
  playerReady=true;setDebug("LOADED ✓ REAL PLAYER");
  console.log("PLAYER HEIGHT",originalSize.y,"SCALED HEIGHT",box.max.y-box.min.y);
},undefined,error=>{console.error(error);addPlayerFallback();setDebug("PLAYER FALLBACK READY",false)});


/* =====================================================
   VISIBLE 3D SUV + DRIVING
===================================================== */
const carGroup=new THREE.Group();
carGroup.position.set(4,0,-6);
scene.add(carGroup);
let carModel=null,driving=false,carSpeed=0,carSteer=0;
function makeFallbackCar(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.6,.75,4.7),mat(0x60656a));
  body.position.y=.72;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.2,.75,2.4),mat(0x1e2b35));
  cabin.position.set(0,1.28,.15);g.add(cabin);
  for(const x of [-1.35,1.35]) for(const z of [-1.45,1.45]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.28,16),mat(0x111111));
    w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w);
  }
  return g;
}
function loadCar(){
  const cl=new GLTFLoader();
  cl.load("https://cdn.3dassets.dev/assets/32519/v1/model.glb",gltf=>{
    carModel=gltf.scene;
    const b0=new THREE.Box3().setFromObject(carModel),s=b0.getSize(new THREE.Vector3());
    const length=Math.max(s.z,s.x);
    if(length>0) carModel.scale.setScalar(3.2/length);
    carModel.updateMatrixWorld(true);
    const b1=new THREE.Box3().setFromObject(carModel),ctr=b1.getCenter(new THREE.Vector3());
    carModel.position.x-=ctr.x;carModel.position.z-=ctr.z;carModel.position.y-=b1.min.y;
    carModel.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    carGroup.add(carModel);
  },undefined,()=>{carGroup.add(makeFallbackCar())});
}
loadCar();

function updateCar(){
  if(!driving)return;
  const forward=(joyY<-.05||keys.w);
  const reverse=(joyY>.05||keys.s);
  if(forward)carSpeed=Math.min(.55,carSpeed+.012);
  else if(reverse)carSpeed=Math.max(-.3,carSpeed-.01);
  else carSpeed*=.93;
  const steer=joyX+(keys.a?-1:0)+(keys.d?1:0);
  carSteer+=(steer-carSteer)*.18;
  carGroup.rotation.y-=carSteer*.028*Math.sign(carSpeed||1);
  carGroup.translateZ(carSpeed);
}

const keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let joyX=0,joyY=0,dragging=false;const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
function joyMove(e){if(!dragging)return;const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e;joyX=Math.max(-1,Math.min(1,(p.clientX-(r.left+r.width/2))/(r.width*.38)));joyY=Math.max(-1,Math.min(1,(p.clientY-(r.top+r.height/2))/(r.height*.38)));stick.style.transform="translate("+joyX*35+"px,"+joyY*35+"px)"}
joy.addEventListener("pointerdown",e=>{dragging=true;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",joyMove);joy.addEventListener("pointerup",()=>{dragging=false;joyX=joyY=0;stick.style.transform=""});
let yaw=0,pitch=.20,lastX=0,lastY=0,look=false; camera.position.set(0,4.2,10); camera.lookAt(0,1,2);
canvas.addEventListener("pointerdown",e=>{look=true;lastX=e.clientX;lastY=e.clientY});canvas.addEventListener("pointermove",e=>{if(!look)return;yaw-=(e.clientX-lastX)*.008;pitch=Math.max(.05,Math.min(.55,pitch+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener("pointerup",()=>look=false);canvas.addEventListener("pointercancel",()=>look=false);
function move(){if(driving){updateCar();return;} let x=joyX,y=joyY;if(keys.w)y=-1;if(keys.s)y=1;if(keys.a)x=-1;if(keys.d)x=1;const input=new THREE.Vector2(x,y);if(input.length()>1)input.normalize();const speed=.13;const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));player.position.addScaledVector(forward,-input.y*speed);player.position.addScaledVector(right,input.x*speed);const moving=input.length()>.05;walkAmount=THREE.MathUtils.lerp(walkAmount,moving?1:0,.18);if(moving){player.rotation.y=Math.atan2(input.x,-input.y)+yaw;walkTime+=.22}}
function animatePlayer(){if(!playerReady||!playerModel)return;const bones={};playerModel.traverse(o=>{if(o.isBone)bones[o.name]=o});const s=Math.sin(walkTime)*.65*walkAmount,a=Math.sin(walkTime)*.42*walkAmount;if(bones.thigh_l)bones.thigh_l.rotation.x=s;if(bones.thigh_r)bones.thigh_r.rotation.x=-s;if(bones.upperarm_l)bones.upperarm_l.rotation.z=-a;if(bones.upperarm_r)bones.upperarm_r.rotation.z=a}
function cameraFollow(){const targetObj=driving?carGroup:player;const dist=driving?7.5:6.2,height=driving?2.9:2.6+pitch*1.6;camera.position.set(targetObj.position.x+Math.sin(yaw)*dist,targetObj.position.y+height,targetObj.position.z+Math.cos(yaw)*dist);const target=targetObj.position.clone();target.y+=driving?1.0:1.15;camera.lookAt(target)}
function loop(){move();animatePlayer();cameraFollow();renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const phone=document.getElementById("phone");document.getElementById("phoneOpen").onclick=()=>phone.classList.add("show");document.getElementById("phoneClose").onclick=()=>phone.classList.remove("show");
document.getElementById("car").onclick=()=>{driving=!driving; if(driving){player.visible=false; setDebug("DRIVING ✓ SUV");}else{player.visible=true; player.position.set(carGroup.position.x+3,0,carGroup.position.z); setDebug("LOADED ✓ REAL PLAYER");}};
const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.addEventListener("open",()=>document.querySelector(".status").textContent="ONLINE ●");ws.addEventListener("close",()=>document.querySelector(".status").textContent="OFFLINE ●");setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:"position",x:player.position.x,z:player.position.z,rotation:player.rotation.y}))},100);
try{screen.orientation?.lock?.("landscape").catch(()=>{})}catch{}
</script>
</body>
</html>
